<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoLife-Chalés</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{--bg:#0d1117;--card:#161b22;--accent:#2ecc71;--text:#e6edf3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text)}

header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);position:sticky;top:0}
header h1{color:var(--accent)}
nav a{margin-left:20px;text-decoration:none;color:var(--text)}
nav a:hover{color:var(--accent)}

section{padding:60px 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px}
.card{background:var(--card);border-radius:20px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover}
.card-content{padding:20px}
.price{color:var(--accent);font-weight:bold}

.gallery{display:flex;gap:10px;margin-top:15px}
.gallery img{width:32%;border-radius:10px;cursor:pointer;transition:0.3s}
.gallery img:hover{transform:scale(1.05)}

.btn{margin-top:15px;padding:12px;border:none;border-radius:10px;background:var(--accent);cursor:pointer}

.calendar{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.month{background:var(--card);padding:15px;border-radius:15px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.day{padding:8px;background:#2ecc71;text-align:center;border-radius:5px;cursor:pointer;transition:.2s}
.day:hover{transform:scale(1.1)}
.selected{background:#f1c40f!important;color:black}

.contact{text-align:center}
.contact a{display:inline-block;padding:15px 25px;background:var(--accent);border-radius:10px;text-decoration:none;color:black}

.modal{display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center}
.modal.active{display:flex}
.modal img{max-width:90%;max-height:90%}
.modal span{position:absolute;top:20px;right:30px;font-size:30px;color:white;cursor:pointer}
</style>
</head>

<body>

<header>
<h1>EcoLife-Chalés</h1>
<nav>
<a href="#inicio">Início</a>
<a href="#horarios">Horários</a>
<a href="#contato">Contato</a>
</nav>
</header>

<section id="inicio">
<h2>Chalé Alfazema</h2>
<div class="cards">

<div class="card">
<img src="https://i.imgur.com/ENPVN2r.jpeg">

<div class="card-content">
<h3>Alfazema</h3>
<p class="price">R$510/dia</p>

<div class="gallery">
  <img src="https://i.imgur.com/ENPVN2r.jpeg" onclick="openModal(this.src)">
  <img src="https://i.imgur.com/C3fO74C.png" onclick="openModal(this.src)">
  <img src="https://i.imgur.com/VLwT0EK.png" onclick="openModal(this.src)">
</div>

<button class="btn">Reservar Agora</button>
</div>
</div>

</div>
</section>

<section id="horarios">
<h2>Escolha um dia para reservar</h2>
<div class="calendar">

<script>
const meses = [
  {nome:'Junho',dias:30},
  {nome:'Julho',dias:31},
  {nome:'Agosto',dias:31},
  {nome:'Setembro',dias:30}
];

meses.forEach(m=>{
  document.write(`<div class='month'><h3>${m.nome}</h3><div class='days'>`);
  for(let i=1;i<=m.dias;i++){
    document.write(`<div class='day' onclick="reservar('${m.nome}',${i},this)">${i}</div>`);
  }
  document.write(`</div></div>`);
});

function reservar(mes,dia,el){
  document.querySelectorAll('.day').forEach(d=>d.classList.remove('selected'));
  el.classList.add('selected');

  const numero = '554792461771';
  const mensagem = encodeURIComponent(`Olá! Quero reservar o Chalé Alfazema para o dia ${dia} de ${mes}.`);

  window.open(`https://wa.me/${numero}?text=${mensagem}`, '_blank');
}
</script>

</div>
</section>

<section id="contato" class="contact">
<h2>Contato</h2>
<a href="https://www.instagram.com/ecolifechales/" target="_blank">Ir para Instagram</a>
</section>

<div id="modal" class="modal">
<span onclick="closeModal()">&times;</span>
<img id="modalImg">
</div>

<script>
function openModal(src){
  document.getElementById('modal').classList.add('active');
  document.getElementById('modalImg').src = src;
}
function closeModal(){
  document.getElementById('modal').classList.remove('active');
}
</script>

</body>
</html>
